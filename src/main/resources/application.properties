# Carrega variaveis do arquivo .env local (nao versionado), se existir
spring.config.import=optional:file:.env[.properties]

# Configurando a conexão com MongoDB enquanto repositório de dados
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk}
spring.data.mongodb.auto-index-creation=true
# Usuarios do sistema ficam na colecao "usuarios" do MongoDB (senha em BCrypt)

# Porta HTTP (plataformas de deploy definem a variavel PORT)
server.port=${PORT:8080}
# Respeita os cabecalhos X-Forwarded-* do proxy HTTPS da hospedagem (redirecionamentos em https)
server.forward-headers-strategy=framework

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
# Cache de templates: desligado no desenvolvimento, ligado em producao (THYMELEAF_CACHE=true)
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
