<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${chamado.id != null} ? 'Editar chamado - Thindesk' : 'Novo chamado - Thindesk'">Chamado - Thindesk</title>
        <th:block th:replace="~{fragments/head :: recursos}"></th:block>
    </head>

    <body class="app">
        <button type="button" class="toggle-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list"></i>
        </button>

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main id="content">
            <a th:href="@{/chamados}" class="voltar"><i class="bi bi-arrow-left"></i> Chamados</a>
            <div class="page-head">
                <div>
                    <h1 th:text="${chamado.id != null} ? 'Editar chamado' : 'Novo chamado'">Chamado</h1>
                    <p>Campos marcados com <span class="obrigatorio">*</span> são obrigatórios.</p>
                </div>
            </div>

            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <section class="panel form-card">
                <div class="panel-head">
                    <h2>Dados do chamado</h2>
                </div>
                <form th:action="@{/chamados/salvar}" th:object="${chamado}" method="post" class="panel-body">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição <span class="obrigatorio">*</span></label>
                        <textarea th:field="*{descricao}" id="descricao" class="form-control" rows="3"
                                  maxlength="500" required placeholder="Descreva o problema"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select th:field="*{status}" id="status" class="form-select">
                                <option th:each="s : ${@statusChamado.valores}" th:value="${s}"
                                        th:text="${@statusChamado.label(s)}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="tipo" class="form-label">Tipo</label>
                            <input type="text" th:field="*{tipo}" id="tipo" class="form-control" list="tipos"
                                   maxlength="60" placeholder="Ex.: Hardware">
                            <datalist id="tipos">
                                <option value="Hardware"></option>
                                <option value="Software"></option>
                                <option value="Rede"></option>
                                <option value="Impressora"></option>
                                <option value="Acesso / Senha"></option>
                            </datalist>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tecnico" class="form-label">Técnico responsável</label>
                            <input type="text" th:field="*{tecnico}" id="tecnico" class="form-control" maxlength="80"
                                   placeholder="Quem vai atender">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="usuario" class="form-label">Solicitante</label>
                            <input type="text" th:field="*{usuario}" id="usuario" class="form-control" maxlength="80"
                                   placeholder="Quem abriu o chamado">
                        </div>
                    </div>

                    <div class="form-acoes">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar chamado</button>
                        <a th:href="@{/chamados}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
