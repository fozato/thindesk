<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - ThinDesk</title>
    <th:block th:replace="~{fragments/head :: recursos}"></th:block>
</head>
<body>
    <div class="auth">
        <div th:replace="~{fragments/auth-marca :: painel}"></div>

        <main class="auth-form">
            <div class="auth-card">
                <div th:replace="~{fragments/auth-marca :: logo-mobile}"></div>

                <h2>Entrar</h2>
                <p class="sub">Use seu usuário e senha para acessar o painel.</p>

                <!-- Mensagens de retorno -->
                <div th:if="${param.error}" class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle-fill"></i> Usuário ou senha inválidos.</div>
                <div th:if="${param.logout}" class="alert alert-info py-2"><i class="bi bi-info-circle-fill"></i> Você saiu do sistema.</div>
                <div th:if="${param.registrado}" class="alert alert-success py-2"><i class="bi bi-check-circle-fill"></i> Conta criada! Faça login para continuar.</div>

                <!-- Formulario de login (o Thymeleaf adiciona o token CSRF automaticamente) -->
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <div class="campo-icone">
                            <i class="bi bi-person"></i>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Seu nome de usuário" autocomplete="username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Senha</label>
                        <div class="campo-icone">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Sua senha" autocomplete="current-password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar <i class="bi bi-arrow-right"></i></button>
                </form>

                <!-- Link para cadastro -->
                <div class="auth-troca">
                    Não tem conta? <a th:href="@{/registro}">Criar conta</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
