<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${cliente.id != null} ? 'Editar cliente - Thindesk' : 'Novo cliente - Thindesk'">Cliente - Thindesk</title>
        <th:block th:replace="~{fragments/head :: recursos}"></th:block>
    </head>

    <body class="app">
        <button type="button" class="toggle-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list"></i>
        </button>

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main id="content">
            <a th:href="@{/clientes}" class="voltar"><i class="bi bi-arrow-left"></i> Clientes</a>
            <div class="page-head">
                <div>
                    <h1 th:text="${cliente.id != null} ? 'Editar cliente' : 'Novo cliente'">Cliente</h1>
                    <p>Campos marcados com <span class="obrigatorio">*</span> são obrigatórios.</p>
                </div>
            </div>

            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <section class="panel form-card">
                <div class="panel-head">
                    <h2>Dados do cliente</h2>
                </div>
                <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post" class="panel-body">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome <span class="obrigatorio">*</span></label>
                        <input type="text" th:field="*{nome}" id="nome" class="form-control" maxlength="100"
                               placeholder="Nome completo" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="tel" th:field="*{telefone}" id="telefone" class="form-control" maxlength="20"
                                   placeholder="(00) 00000-0000">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="setor" class="form-label">Setor</label>
                            <input type="text" th:field="*{setor}" id="setor" class="form-control" maxlength="60"
                                   placeholder="Ex.: Financeiro">
                        </div>
                    </div>

                    <div class="form-acoes">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar cliente</button>
                        <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
