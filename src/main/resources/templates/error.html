<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Erro - Thindesk</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="min-vh-100 d-flex justify-content-center align-items-center p-3">
            <div class="card shadow-sm border-0 text-center p-4" style="max-width: 460px; width: 100%;">
                <img th:src="@{/images/logo.png}" alt="Thindesk" class="mx-auto mb-3" width="80">
                <div class="display-5 fw-bold text-secondary" th:text="${status} ?: 'Erro'">Erro</div>

                <th:block th:switch="${status}">
                    <p th:case="404" class="mt-2 mb-4">A página ou o registro que você procura não existe.</p>
                    <p th:case="403" class="mt-2 mb-4">Acesso negado. Sua sessão pode ter expirado: recarregue a página ou entre novamente.</p>
                    <p th:case="*" class="mt-2 mb-4">Ocorreu um erro inesperado. Tente novamente em instantes.</p>
                </th:block>

                <div class="d-flex gap-2 justify-content-center">
                    <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Voltar ao início</a>
                    <a th:href="@{/login}" class="btn btn-outline-secondary">Entrar</a>
                </div>
            </div>
        </div>
    </body>
</html>
