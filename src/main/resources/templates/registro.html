<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta - ThinDesk</title>
    <th:block th:replace="~{fragments/head :: recursos}"></th:block>
</head>
<body>
    <div class="auth">
        <div th:replace="~{fragments/auth-marca :: painel}"></div>

        <main class="auth-form">
            <div class="auth-card">
                <div th:replace="~{fragments/auth-marca :: logo-mobile}"></div>

                <h2>Criar conta</h2>
                <p class="sub">Cadastre um usuário para acessar o sistema.</p>

                <div th:if="${erro}" class="alert alert-danger py-2">
                    <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${erro}"></span>
                </div>

                <form th:action="@{/registro}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <div class="campo-icone">
                            <i class="bi bi-person"></i>
                            <input type="text" class="form-control" id="username" name="username"
                                   th:value="${username}" placeholder="Ex.: maria.silva"
                                   minlength="3" maxlength="30" pattern="[A-Za-z0-9._\-]{3,30}"
                                   title="3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado"
                                   autocomplete="username" required autofocus>
                        </div>
                        <div class="form-text">3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <div class="campo-icone">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="form-control" id="password" name="password"
                                   th:attr="minlength=${senhaMin}" autocomplete="new-password" required>
                        </div>
                        <div class="form-text" th:text="|Mínimo de ${senhaMin} caracteres.|"></div>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Confirmar senha</label>
                        <div class="campo-icone">
                            <i class="bi bi-shield-lock"></i>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                   autocomplete="new-password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Criar conta <i class="bi bi-arrow-right"></i></button>
                </form>

                <div class="auth-troca">
                    Já tem conta? <a th:href="@{/login}">Entrar</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
