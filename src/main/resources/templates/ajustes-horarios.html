<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários de Atendimento - Thindesk</title>
    <th:block th:replace="~{fragments/head :: recursos}"></th:block>
</head>
<body class="app">
    <button type="button" class="toggle-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <i class="bi bi-list"></i>
    </button>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main id="content">
        <div class="page-head">
            <div>
                <h1>Horários de atendimento</h1>
                <p>Defina em que dias e horários cada setor atende chamados.</p>
            </div>
        </div>

        <div th:replace="~{fragments/alertas :: alertas}"></div>

        <section class="panel mb-4">
            <div class="panel-head">
                <h2>Novo horário</h2>
            </div>
            <form th:action="@{/ajustes-horarios/salvar}" th:object="${novoHorario}" method="post" class="panel-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-6 col-lg-3">
                        <label for="setor" class="form-label">Setor</label>
                        <input type="text" th:field="*{setor}" id="setor" class="form-control" maxlength="60"
                               placeholder="Ex.: Suporte TI" required>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <label for="diaSemana" class="form-label">Dia</label>
                        <select th:field="*{diaSemana}" id="diaSemana" class="form-select" required>
                            <option th:each="dia : ${dias}" th:value="${dia}" th:text="${dia}"></option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label for="horarioInicio" class="form-label">Início</label>
                        <input type="time" th:field="*{horarioInicio}" id="horarioInicio" class="form-control" required>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label for="horarioFim" class="form-label">Fim</label>
                        <input type="time" th:field="*{horarioFim}" id="horarioFim" class="form-control" required>
                    </div>
                    <div class="col-lg-2">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Adicionar</button>
                    </div>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h2>Horários cadastrados</h2>
                <span class="text-muted small" th:text="|${#lists.size(horarios)} no total|"></span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Setor</th>
                            <th>Dia</th>
                            <th>Horário</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="horario : ${horarios}">
                            <td class="cel-principal" th:text="${horario.setor}"></td>
                            <td><span class="chip" th:text="${horario.diaSemana}"></span></td>
                            <td class="tabular">
                                <i class="bi bi-clock text-muted me-1"></i>
                                <span th:text="|${horario.horarioInicio} – ${horario.horarioFim}|"></span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/ajustes-horarios/excluir/{id}(id=${horario.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Excluir este horário?');">
                                    <button type="submit" class="btn-icon danger" title="Excluir" aria-label="Excluir horário">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(horarios)}">
                            <td colspan="4" class="vazio">
                                <i class="bi bi-clock"></i>
                                Nenhum horário cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script th:src="@{/js/script.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
