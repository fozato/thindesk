<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clientes - Thindesk</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <main id="content">
            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Clientes</h2>
                <a th:href="@{/clientes/novo}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Novo cliente
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Telefone</th>
                                <th>Setor</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cliente : ${clientes}">
                                <td th:text="${cliente.nome}"></td>
                                <td th:text="${cliente.telefone} ?: '—'"></td>
                                <td th:text="${cliente.setor} ?: '—'"></td>
                                <td class="text-end text-nowrap">
                                    <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-warning btn-sm">
                                        <i class="bi bi-pencil"></i> Editar
                                    </a>
                                    <form th:action="@{/clientes/excluir/{id}(id=${cliente.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Excluir este cliente?');">
                                        <button type="submit" class="btn btn-danger btn-sm">
                                            <i class="bi bi-trash"></i> Excluir
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(clientes)}">
                                <td colspan="4" class="text-center text-muted py-4">Nenhum cliente cadastrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
