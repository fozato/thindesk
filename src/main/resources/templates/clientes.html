<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clientes - Thindesk</title>
        <th:block th:replace="~{fragments/head :: recursos}"></th:block>
    </head>

    <body class="app">
        <button type="button" class="toggle-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list"></i>
        </button>

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main id="content">
            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <div class="page-head">
                <div>
                    <h1>Clientes</h1>
                    <p th:text="|${#lists.size(clientes)} cliente(s) cadastrado(s)|">0 clientes</p>
                </div>
                <a th:href="@{/clientes/novo}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Novo cliente
                </a>
            </div>

            <div class="panel">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Telefone</th>
                                <th>Setor</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cliente : ${clientes}">
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="avatar avatar-sm tone-ink" th:text="${#strings.substring(cliente.nome, 0, 1)}">C</span>
                                        <span class="cel-principal" th:text="${cliente.nome}"></span>
                                    </div>
                                </td>
                                <td class="tabular" th:text="${cliente.telefone} ?: '—'" th:classappend="${cliente.telefone} ? '' : 'cel-vazia'"></td>
                                <td>
                                    <span th:if="${cliente.setor}" class="chip" th:text="${cliente.setor}"></span>
                                    <span th:unless="${cliente.setor}" class="cel-vazia">—</span>
                                </td>
                                <td class="text-end text-nowrap">
                                    <div class="acoes">
                                        <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn-icon"
                                           title="Editar" aria-label="Editar cliente">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/clientes/excluir/{id}(id=${cliente.id})}" method="post"
                                              onsubmit="return confirm('Excluir este cliente?');">
                                            <button type="submit" class="btn-icon danger" title="Excluir" aria-label="Excluir cliente">
                                                <i class="bi bi-trash3"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(clientes)}">
                                <td colspan="4" class="vazio">
                                    <i class="bi bi-people"></i>
                                    Nenhum cliente cadastrado.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
