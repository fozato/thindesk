<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard - Thindesk</title>
        <th:block th:replace="~{fragments/head :: recursos}"></th:block>
    </head>
    <body class="app">
        <!-- Botao para abrir/fechar o menu em telas pequenas -->
        <button type="button" class="toggle-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list"></i>
        </button>

        <!-- Sidebar incluida como fragmento -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Conteudo principal -->
        <main id="content">
            <div th:replace="~{home :: content}"></div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
