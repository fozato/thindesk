<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <div th:fragment="sidebar">
            <div id="sidebar" class="d-flex flex-column">
                <h4 class="text-center py-3">Thindesk</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/chamados}">
                            <i class="bi bi-headset"></i> Chamados
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-people"></i> Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/ajustes-horarios}">
                            <i class="bi bi-alarm"></i> Horários de Atendimento
                        </a>
                    </li>
                </ul>
                <div class="mt-auto px-3 pb-3">
                    <div class="small text-white-50 mb-2" th:if="${usuarioLogado}">
                        <i class="bi bi-person-circle"></i> <span th:text="${usuarioLogado}"></span>
                    </div>
                    <!-- Logout via POST (o Thymeleaf adiciona o token CSRF) -->
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light btn-sm w-100">
                            <i class="bi bi-box-arrow-right"></i> Sair
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
