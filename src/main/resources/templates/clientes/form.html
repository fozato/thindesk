<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${cliente.id != null} ? 'Editar cliente - Thindesk' : 'Novo cliente - Thindesk'">Cliente - Thindesk</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <main id="content">
            <h2 class="mb-4" th:text="${cliente.id != null} ? 'Editar cliente' : 'Novo cliente'">Cliente</h2>

            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post"
                  class="card card-body shadow-sm border-0 form-card">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome *</label>
                    <input type="text" th:field="*{nome}" id="nome" class="form-control" maxlength="100" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="tel" th:field="*{telefone}" id="telefone" class="form-control" maxlength="20"
                               placeholder="(00) 00000-0000">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="setor" class="form-label">Setor</label>
                        <input type="text" th:field="*{setor}" id="setor" class="form-control" maxlength="60">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
