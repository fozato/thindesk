<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Erro - Thindesk</title>
        <th:block th:replace="~{fragments/head :: recursos}"></th:block>
    </head>
    <body>
        <main class="erro-wrap">
            <div class="panel erro-card">
                <img th:src="@{/images/logo.png}" alt="Thindesk" width="84" height="84">
                <div class="erro-codigo" th:text="${status} ?: 'Erro'">Erro</div>

                <th:block th:switch="${status}">
                    <p th:case="404" class="text-muted mb-4">A página ou o registro que você procura não existe.</p>
                    <p th:case="403" class="text-muted mb-4">Acesso negado. Sua sessão pode ter expirado: recarregue a página ou entre novamente.</p>
                    <p th:case="*" class="text-muted mb-4">Ocorreu um erro inesperado. Tente novamente em instantes.</p>
                </th:block>

                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Voltar ao início</a>
                    <a th:href="@{/login}" class="btn btn-outline-secondary">Entrar</a>
                </div>
            </div>
        </main>
    </body>
</html>
