<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chamados - Thindesk</title>
        <th:block th:replace="~{fragments/head :: recursos}"></th:block>
    </head>

    <body class="app">
        <button type="button" class="toggle-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list"></i>
        </button>

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main id="content">
            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <div class="page-head">
                <div>
                    <h1>Chamados</h1>
                    <p th:text="|${#lists.size(chamados)} chamado(s) registrado(s)|">0 chamados</p>
                </div>
                <a th:href="@{/chamados/novo}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Novo chamado
                </a>
            </div>

            <div class="panel">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Descrição</th>
                                <th>Status</th>
                                <th>Tipo</th>
                                <th>Técnico</th>
                                <th>Solicitante</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="chamado : ${chamados}">
                                <td class="cel-principal" th:text="${chamado.descricao}"></td>
                                <td><span class="status-pill" th:classappend="${@statusChamado.badge(chamado.status)}"
                                          th:text="${@statusChamado.label(chamado.status)}"></span></td>
                                <td>
                                    <span th:if="${chamado.tipo}" class="chip" th:text="${chamado.tipo}"></span>
                                    <span th:unless="${chamado.tipo}" class="cel-vazia">—</span>
                                </td>
                                <td class="text-nowrap" th:text="${chamado.tecnico} ?: '—'" th:classappend="${chamado.tecnico} ? '' : 'cel-vazia'"></td>
                                <td class="text-nowrap" th:text="${chamado.usuario} ?: '—'" th:classappend="${chamado.usuario} ? '' : 'cel-vazia'"></td>
                                <td class="text-end text-nowrap">
                                    <div class="acoes">
                                        <a th:href="@{/chamados/editar/{id}(id=${chamado.id})}" class="btn-icon"
                                           title="Editar" aria-label="Editar chamado">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/chamados/excluir/{id}(id=${chamado.id})}" method="post"
                                              onsubmit="return confirm('Excluir este chamado?');">
                                            <button type="submit" class="btn-icon danger" title="Excluir" aria-label="Excluir chamado">
                                                <i class="bi bi-trash3"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(chamados)}">
                                <td colspan="6" class="vazio">
                                    <i class="bi bi-inbox"></i>
                                    Nenhum chamado cadastrado.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
