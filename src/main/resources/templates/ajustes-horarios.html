<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários de Atendimento - Thindesk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="toggle-btn btn btn-dark d-md-none">
        <span>&#9776;</span>
    </div>

    <aside>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <main id="content">
        <h2 class="mb-4">Horários de Atendimento por Setor</h2>

        <div th:replace="~{fragments/alertas :: alertas}"></div>

        <form th:action="@{/ajustes-horarios/salvar}" th:object="${novoHorario}" method="post"
              class="card card-body shadow-sm border-0 mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="setor" class="form-label">Setor</label>
                    <input type="text" th:field="*{setor}" id="setor" class="form-control" maxlength="60" required>
                </div>
                <div class="col-md-3">
                    <label for="diaSemana" class="form-label">Dia</label>
                    <select th:field="*{diaSemana}" id="diaSemana" class="form-select" required>
                        <option th:each="dia : ${dias}" th:value="${dia}" th:text="${dia}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="horarioInicio" class="form-label">Início</label>
                    <input type="time" th:field="*{horarioInicio}" id="horarioInicio" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label for="horarioFim" class="form-label">Fim</label>
                    <input type="time" th:field="*{horarioFim}" id="horarioFim" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Salvar</button>
                </div>
            </div>
        </form>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Setor</th>
                            <th>Dia</th>
                            <th>Início</th>
                            <th>Fim</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="horario : ${horarios}">
                            <td th:text="${horario.setor}"></td>
                            <td th:text="${horario.diaSemana}"></td>
                            <td th:text="${horario.horarioInicio}"></td>
                            <td th:text="${horario.horarioFim}"></td>
                            <td class="text-end">
                                <form th:action="@{/ajustes-horarios/excluir/{id}(id=${horario.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Excluir este horário?');">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="bi bi-trash"></i> Excluir
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(horarios)}">
                            <td colspan="5" class="text-center text-muted py-4">Nenhum horário cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script th:src="@{/js/script.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
