<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Criar conta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #ffffff;
        }
        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card text-center">
            <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
            <h3 class="mb-4">Criar conta</h3>

            <div th:if="${erro}" class="alert alert-danger py-2" th:text="${erro}"></div>

            <form th:action="@{/registro}" method="post" class="text-start">
                <div class="form-group mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username"
                           th:value="${username}" placeholder="Ex.: maria.silva"
                           minlength="3" maxlength="30" pattern="[A-Za-z0-9._\-]{3,30}"
                           title="3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado"
                           autocomplete="username" required>
                </div>
                <div class="form-group mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password"
                           th:attr="minlength=${senhaMin}" autocomplete="new-password" required>
                    <div class="form-text" th:text="|Mínimo de ${senhaMin} caracteres.|"></div>
                </div>
                <div class="form-group mb-3">
                    <label for="confirmPassword" class="form-label">Confirmar senha</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                           autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
            </form>

            <div class="mt-3">
                Já tem conta? <a th:href="@{/login}" class="text-decoration-none">Entrar</a>
            </div>
        </div>
    </div>
</body>
</html>
